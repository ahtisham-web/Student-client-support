<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVFORGE Student Support AI Agent</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #6366f1;
    --user-bubble: #6366f1;
    --bot-bubble: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid #334155;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    font-size: 14px;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 4px;
  }
  .bot.unrelated {
    border: 1px solid #475569;
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  #inputBar {
    display: flex;
    padding: 14px;
    gap: 10px;
    background: var(--panel);
    border-top: 1px solid #334155;
  }
  #messageInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #0f172a;
    color: var(--text);
    font-size: 14px;
    resize: none;
  }
  #sendBtn {
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  #sendBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #serverBar {
    display: flex;
    gap: 8px;
    padding: 10px 14px 0;
    background: var(--panel);
    align-items: center;
  }
  #serverBar input {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: var(--text);
    font-size: 12px;
  }
  #serverBar label {
    font-size: 12px;
    color: var(--muted);
  }
  .typing {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>

<header>
  <h1>🎓 DEVFORGE Student Support AI Agent</h1>
  <p>Ask about internships, AI Engineering, Web Dev, Python, FastAPI, LangChain, LangGraph, GitHub, Render, tasks & certificates.</p>
</header>

<div id="serverBar">
  <label for="serverUrl">Backend URL:</label>
  <input id="serverUrl" type="text" value="http://127.0.0.1:8000" />
</div>

<div id="chat"></div>

<div id="inputBar">
  <textarea id="messageInput" rows="1" placeholder="Type your question and press Enter..."></textarea>
  <button id="sendBtn">Send</button>
</div>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const serverUrlEl = document.getElementById("serverUrl");

function addMessage(text, sender, category) {
  const bubble = document.createElement("div");
  bubble.className = "msg " + sender + (category === "unrelated" ? " unrelated" : "");
  bubble.textContent = text;
  if (sender === "bot" && category) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = category === "related" ? "✅ related question" : "⚠️ unrelated question";
    bubble.appendChild(document.createElement("br"));
    bubble.appendChild(meta);
  }
  chatEl.appendChild(bubble);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function addTyping() {
  const el = document.createElement("div");
  el.className = "msg bot typing";
  el.id = "typingIndicator";
  el.textContent = "Thinking...";
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage(text, "user");
  inputEl.value = "";
  sendBtn.disabled = true;
  addTyping();

  const baseUrl = serverUrlEl.value.trim().replace(/\/$/, "");

  try {
    const res = await fetch(baseUrl + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });

    if (!res.ok) {
      throw new Error("Server returned status " + res.status);
    }

    const data = await res.json();
    removeTyping();
    addMessage(data.response, "bot", data.category);
  } catch (err) {
    removeTyping();
    addMessage(
      "⚠️ Couldn't reach the backend at " + baseUrl + ". Make sure the FastAPI server is running and the URL above is correct. (" + err.message + ")",
      "bot"
    );
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

addMessage(
  "Hi! I'm the DEVFORGE Student Support AI Agent. Ask me anything about internships, AI Engineering, Web Dev, Python, FastAPI, LangChain, LangGraph, GitHub, Render, tasks, or certificates.",
  "bot"
);
</script>

</body>
</html>
