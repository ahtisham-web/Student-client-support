services:
  - type: web
    name: devforge-student-support-agent
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CLOUD_URL
        value: https://ollama.com/api/chat
      - key: OLLAMA_MODEL
        value: qwen3.5:cloud
